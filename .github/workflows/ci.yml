name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # WKWebView paths: build and test on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Node only runs Vitest (jsdom breaks on Bun's runtime); everything else runs on Bun
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Versions agree across manifests
        run: bun scripts/version.mjs check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:rust
      - run: bun run lint:rust
      - run: bun run build
      # Build output sizes vs. perf/baseline.json (docs/performance.md). Timing
      # baselines are machine-bound, so `bun run perf micro` runs locally.
      - name: Bundle size budget
        run: bun run perf bundle --no-build
      # test:ug and test:e2e need the ug CLI, an embedding model and a model
      # download; run them locally or on a self-hosted runner (see AGENTS.md §6).

  # Windows (WebView2) ships too: the same suite on Windows catches Unix-only
  # paths, env and permissions before a release does. e2e runs locally only.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:rust
      - run: bun run lint:rust

  # Known vulnerabilities in shipped dependencies fail the build (AGENTS.md §9).
  # Separate job: it needs the network, and a new advisory shouldn't hide test results.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: bun audit (JS dependencies)
        run: bun audit --audit-level=high
      - name: cargo audit (RustSec advisory DB)
        run: cargo audit --file src-tauri/Cargo.lock

