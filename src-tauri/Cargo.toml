[package]
name = "andai"
version = "0.1.1"
description = "Andai — a local-first AI agent"
edition = "2021"

[lib]
name = "andai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# Verifies downloaded Laya checkpoint files (laya/store.rs); already in the tree via Tauri.
sha2 = "0.10"

# The Laya decision model runs on MLX, which exists only for Apple Silicon.
# Everywhere else laya/ compiles to "not supported" and decisions stay on wllama.
# mlx-rs is pinned exactly: it wraps a specific MLX release (0.32).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = "=0.32.0"
# No `http` feature: the Rust side has no HTTP client (AGENTS.md §9).
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
