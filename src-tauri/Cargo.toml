[package]
name = "andai"
version = "0.1.1"
description = "Andai — a local-first AI agent"
edition = "2021"

[lib]
name = "andai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-localhost = "2"

[dev-dependencies]
tempfile = "3"
