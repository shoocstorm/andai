[package]
name = "andai"
version = "0.1.5"
description = "Andai — a local-first AI agent"
edition = "2021"

[lib]
name = "andai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# Verifies downloaded Laya checkpoint files (laya/store.rs); already in the tree via Tauri.
sha2 = "0.10"
# The native engine's grammar constraint (llm/grammar.rs): a lazy DFA. Pure
# Rust, and already in the tree through Tauri's `regex`; no features beyond it.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "hybrid"] }

# The Laya decision model runs on MLX, which exists only for Apple Silicon.
# Everywhere else laya/ compiles to "not supported" and decisions stay on wllama.
# mlx-rs is pinned exactly: it wraps a specific MLX release (0.32).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = "=0.32.0"
# The C API under mlx-rs (the same crate and build, already in the tree): Qwen3.5's
# recurrence runs a custom Metal kernel, which mlx-rs doesn't wrap (llm/delta.rs).
mlx-sys = "=0.6.0"
# No `http` feature: the Rust side has no HTTP client (AGENTS.md §9).
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

# mlx-sys builds MLX's C++ as CMake "Debug" when its build script has debug
# assertions, which made Laya ~4× slower in `tauri dev` and the agent eval
# (53 ms vs 12.7 ms per decision). Build MLX and the Laya path's Rust
# dependencies optimized even in dev builds.
[profile.dev.package.mlx-sys]
opt-level = 3
debug-assertions = false
[profile.dev.package.mlx-rs]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
